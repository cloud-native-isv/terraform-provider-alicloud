description = "Create or update the Requirements from a natural language feature description.
handoffs:
   - label: Clarify Requirements
     agent: speckit.clarify
     prompt: Resolve any underspecified areas in the requirements specification.
     send: true
   - label: Build Technical Plan
     agent: speckit.plan
     prompt: Generate an implementation plan based on the requirements specification.
     send: true
scripts:
   sh: |
      cat << "

prompt = """
## User Input

```text
$ARGUMENTS
```

Process `$ARGUMENTS` per the [User Input Protocol](skills/sdd-workflow/references/user-input-protocol.md). The text after `/speckit.requirements` IS the feature description.

## Outline

1. **Generate short name** (2-4 words, action-noun format, e.g., "user-auth", "fix-payment-timeout").

2. **Check existing branches**:
   - `git fetch --all --prune`
   - Find highest number across: remote branches, local branches, specs directories matching `[0-9]+-<short-name>`
   - Next number = highest + 1 (or 1 if none found)

3. **Run script** `
```bash
cat << 'EOF' | .specify/scripts/bash/create-new-requirement.sh --json --short-name "<SHORT_NAME>"
$ARGUMENTS
EOF
```
` from repo root (replace `<SHORT_NAME>`). Parse JSON for BRANCH_NAME and SPEC_FILE. Run only once.

4. **Load** `.specify/templates/spec-template.md` for required sections.

5. **Execute spec generation**:
   1. Parse user description. If empty: ERROR.
   2. Extract key concepts: actors, actions, data, constraints.
   3. Initialize `Related Feature`: `Feature ID: Need clarification`, `Feature Name: Need clarification` (resolved by `/speckit.clarify`).
   4. For unclear aspects: make informed guesses. Only use `[NEEDS CLARIFICATION: question]` if choice significantly impacts scope/UX, multiple interpretations exist, and no reasonable default. **Max 3 markers.**
   5. Fill User Scenarios & Testing.
   6. Generate testable Functional Requirements.
   7. Define measurable, technology-agnostic Success Criteria.
   8. Identify Key Entities (if data involved).

6. **Write spec** to SPEC_FILE. Preserve section order. Keep `Related Feature` with default "Need clarification" values.

7. **Quality Validation**: Follow the validation process in `skills/sdd-workflow/references/requirements-guidelines.md`:
   - Create checklist at `FEATURE_DIR/checklists/requirements.md`
   - Validate spec against each item
   - Handle failures (max 3 iterations) and remaining clarifications (max 3 questions with table format)
   - Update checklist with pass/fail status

8. **Report**: Branch name, spec file path, checklist results, next phase readiness.

## Feature Integration

Apply [Feature Integration Protocol](skills/sdd-workflow/references/feature-integration.md) § Feature Binding Rules. This command binds specs to features (many-specs to one-feature). See the protocol for lookup rules and integration responsibilities.

## Guidelines

For detailed quality validation, success criteria guidelines, and AI generation best practices, see `skills/sdd-workflow/references/requirements-guidelines.md`.

Key rules:
- Focus on WHAT and WHY, not HOW
- Written for business stakeholders
- No embedded checklists (separate command)
- Max 3 [NEEDS CLARIFICATION] markers

## Handoffs

**Before**: Optional `/speckit.feature` to ensure feature registry is up to date.

**After**: If spec has `[NEEDS CLARIFICATION]` or `Related Feature: Need clarification` → `/speckit.clarify`. Otherwise → `/speckit.plan`.
"""
